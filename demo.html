<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JET//LAB · squad demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M8 1 L14 14 L8 11 L2 14Z%27 fill=%27%23ff5a1f%27/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #15171a; overflow: hidden; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; height: 100vh; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    .you { outline: 2px solid #ff3b30; outline-offset: -2px; }
  </style>
</head>
<body>
  <!-- Squad demo: four game windows in one page (easy to screen-record).
       Top-right is you; the other three are god-mode wingman bots that join
       your squad, launch by themselves and fly formation on you.
       /demo.html?name=ace&room=lan&server=ws://192.168.1.80:5200 -->
  <div class="grid" id="grid"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const pass = ['room', 'server'].filter((k) => q.has(k)).map((k) => `&${k}=${encodeURIComponent(q.get(k))}`).join('');
    const you = `/?mp${q.has('name') ? `&name=${encodeURIComponent(q.get('name'))}` : ''}${pass}`;
    const bot = (n) => `/?mp&bot&name=wing-${n}${pass}`;
    // grid order: top-left, top-right, bottom-left, bottom-right
    const frames = [bot(1), you, bot(2), bot(3)];
    const grid = document.getElementById('grid');
    frames.forEach((src, i) => {
      const f = document.createElement('iframe');
      f.src = src; f.allow = 'autoplay; fullscreen';
      if (src === you) { f.className = 'you'; f.id = 'you'; }
      grid.appendChild(f);
    });
    // keys go to your window; a click on another one hands them back
    const yourFrame = document.getElementById('you');
    yourFrame.addEventListener('load', () => yourFrame.contentWindow.focus());
    addEventListener('blur', () => setTimeout(() => yourFrame.contentWindow.focus(), 0));
  </script>
</body>
</html>
